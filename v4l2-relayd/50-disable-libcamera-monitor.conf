# Installed to /usr/share/wireplumber/wireplumber.conf.d/
#
# The Intel IPU6/IPU7 MIPI sensor can only be opened by one libcamera client at
# a time. v4l2-relayd needs that exclusive access to feed the v4l2loopback
# device, so we tell WirePlumber not to manage the libcamera camera itself.
#
# Applications keep working: they use the "Intel IPU Camera" loopback device
# (exposed via WirePlumber's V4L2 monitor and as a plain /dev/video node)
# instead of the raw libcamera source.
#
# To re-enable libcamera in WirePlumber (e.g. to use the camera directly from a
# libcamera-aware app), override this in /etc/wireplumber/wireplumber.conf.d/.
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}
