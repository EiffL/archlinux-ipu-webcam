# The relay owns the physical MIPI camera; PipeWire consumes its V4L2 output.
# Ordinary USB webcams still use the V4L2 monitor.
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}

monitor.v4l2.rules = [
  {
    matches = [ { api.v4l2.cap.driver = "isys" } ]
    actions = { update-props = { device.disabled = true } }
  }
  {
    matches = [ { node.description = "~Dell XPS 9315 Camera.*" } ]
    actions = { update-props = { priority.session = 2000 } }
  }
]
