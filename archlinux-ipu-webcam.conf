# This is a shell configuration file, owned by root. Changes take effect after:
# sudo systemctl restart archlinux-ipu-webcam.service
# Changing DEVICE/CARD_LABEL requires a reboot (old loopbacks are not removed).
DEVICE=/dev/video60
CARD_LABEL='Dell XPS 9315 Camera'
WIDTH=1280
HEIGHT=720
FRAMERATE=30
WAIT_SECONDS=45

# crop fills the output frame, trimming top/bottom at the default 16:9 size.
# fit preserves the entire view, adding side bars and scaling down the image.
FRAMING=crop

# Use the sensor's native capture size, then crop/scale for applications.
# Do not force 1280x720 directly on libcamerasrc.
# Set to no to compare upstream's uncalibrated profile with our colour matrix.
USE_TUNING=yes
